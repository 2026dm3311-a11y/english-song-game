<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>POP SONG QUIZ</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f4f6fb;
  text-align: center;
}

/* 모든 화면 */
.screen {
  display: none;
  max-width: 950px;
  margin: auto;
}

.screen.active {
  display: block;
}

/* 제목 */
h1 {
  font-size: 36px;
  margin-bottom: 15px;
}

h2 {
  margin: 10px 0;
}

/* 입력 */
input {
  padding: 14px;
  font-size: 18px;
  border: 2px solid #ccc;
  border-radius: 10px;
  outline: none;
  width: 70%;
  max-width: 500px;
}

/* 버튼 */
button {
  padding: 13px 20px;
  margin: 6px;
  border: none;
  border-radius: 10px;
  font-size: 17px;
  cursor: pointer;
}

button:hover {
  transform: scale(1.04);
}

/* 팀 추가 */
.addButton {
  background: #4caf50;
  color: white;
}

/* 시작 */
.startButton {
  background: #222;
  color: white;
  font-size: 20px;
  padding: 15px 30px;
}

/* 유튜브 */
.youtubeButton {
  background: #ff0000;
  color: white;
}

/* 정답 확인 */
.answerButton {
  background: #2196f3;
  color: white;
}

/* 다음 팀 */
.nextButton {
  background: #673ab7;
  color: white;
}

/* 꽝 */
.boomButton {
  background: #ff5722;
  color: white;
}

/* 팀 목록 */
.teamBox {
  display: inline-block;
  background: white;
  padding: 12px 20px;
  margin: 6px;
  border-radius: 10px;
  box-shadow: 0 2px 7px #ccc;
  font-size: 17px;
}

/* 현재 팀 */
.turn {
  font-size: 26px;
  font-weight: bold;
  margin: 20px 0;
}

/* 게임 보드 */
#board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
  margin: 25px auto;
}

/* 번호 */
.cell {
  background: white;
  border: 3px solid #333;
  border-radius: 12px;
  padding: 25px 5px;
  font-size: 23px;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
}

.cell:hover {
  background: #ddd;
  transform: scale(1.04);
}

.cell.used {
  background: #aaa;
  color: #666;
  cursor: default;
  transform: none;
}

/* 답변 화면 */
.questionBox {
  background: white;
  max-width: 650px;
  margin: 40px auto;
  padding: 35px 25px;
  border-radius: 20px;
  box-shadow: 0 4px 15px #ccc;
}

.numberTitle {
  font-size: 30px;
  font-weight: bold;
  margin-bottom: 25px;
}

/* 정답 입력 */
#answerInput {
  width: 85%;
  margin: 15px 0;
}

/* 결과 */
#result {
  min-height: 150px;
  margin: 25px 0;
  font-size: 25px;
  font-weight: bold;
  line-height: 1.8;
}

/* 정답 강조 */
.correctAnswer {
  font-size: 30px;
  margin-top: 15px;
}

/* 점수판 */
.scoreBoard {
  background: white;
  padding: 20px;
  border-radius: 18px;
  box-shadow: 0 3px 10px #ccc;
  margin-top: 25px;
}

.scoreRow {
  display: flex;
  justify-content: space-between;
  background: #eee;
  padding: 12px 18px;
  margin: 7px 0;
  border-radius: 10px;
  font-size: 20px;
}

/* 큰 점수 효과 */
#effect {
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  background: rgba(255,255,255,0.94);
  font-size: 75px;
  font-weight: bold;
}

/* 게임 종료 */
#finalScores {
  background: white;
  padding: 25px;
  border-radius: 20px;
  box-shadow: 0 3px 12px #ccc;
  font-size: 22px;
  line-height: 1.8;
}

/* 모바일 */
@media(max-width:700px) {

  #board {
    grid-template-columns: repeat(5, 1fr);
    gap: 7px;
  }

  .cell {
    padding: 20px 3px;
    font-size: 19px;
  }

  input {
    width: 90%;
  }

  h1 {
    font-size: 30px;
  }

}

</style>
</head>


<body>


<!-- ==================================================
     시작 화면
================================================== -->

<div id="startScreen" class="screen active">

  <h1>🎵 POP SONG QUIZ 🎵</h1>

  <p>35곡 + 꽝 5개 = 총 40칸</p>

  <p>
    ✅ 정답 +2점
   　❌ 오답 0점
   　💥 꽝 -1점
  </p>

  <br>

  <input
    id="teamInput"
    type="text"
    placeholder="팀 이름 입력"
  >

  <button
    class="addButton"
    onclick="addTeam()"
  >
    👥 팀 추가
  </button>

  <div id="teamList"></div>

  <br><br>

  <button
    class="startButton"
    onclick="startGame()"
  >
    🎮 게임 시작
  </button>

</div>



<!-- ==================================================
     번호판 화면
================================================== -->

<div id="boardScreen" class="screen">

  <h1>🎵 POP SONG QUIZ 🎵</h1>

  <div
    id="turnText"
    class="turn"
  ></div>

  <div id="board"></div>

  <div class="scoreBoard">

    <h2>🏆 점수판</h2>

    <div id="scores"></div>

  </div>

</div>



<!-- ==================================================
     답변 화면
================================================== -->

<div id="questionScreen" class="screen">

  <div class="questionBox">

    <div
      id="questionNumber"
      class="numberTitle"
    ></div>

    <div id="songArea">

      <p>
        🎧 노래를 듣고 제목을 맞혀보세요!
      </p>

      <button
        id="youtubeButton"
        class="youtubeButton"
        onclick="openYouTube()"
      >
        ▶️ 유튜브에서 노래 듣기
      </button>

      <br>

      <input
        id="answerInput"
        type="text"
        placeholder="노래 제목 입력"
        onkeydown="if(event.key === 'Enter') checkAnswer()"
      >

      <br>

      <button
        class="answerButton"
        onclick="checkAnswer()"
      >
        ✅ 정답 확인
      </button>

    </div>


    <!-- 꽝 화면 -->

    <div
      id="boomArea"
      style="display:none;"
    >

      <div style="font-size:60px;">
        💥
      </div>

      <h2>꽝!</h2>

      <button
        class="boomButton"
        onclick="boomAnswer()"
      >
        💥 꽝 처리 (-1점)
      </button>

    </div>


    <!-- 결과 -->

    <div id="result"></div>


    <!-- 다음 팀 -->

    <button
      id="nextButton"
      class="nextButton"
      onclick="goNextTurn()"
      style="display:none;"
    >
      ➡️ 다음 팀
    </button>

  </div>

</div>



<!-- ==================================================
     게임 종료
================================================== -->

<div id="endScreen" class="screen">

  <h1>🏆 게임 종료!</h1>

  <div id="winner"></div>

  <div id="finalScores"></div>

</div>



<!-- 큰 점수 효과 -->

<div id="effect"></div>



<script>


/* ==================================================
   노래 35곡
================================================== */

const songs = [

  ["Shape of You", "Ed Sheeran"],

  ["Believer", "Imagine Dragons"],

  ["Counting Stars", "OneRepublic"],

  ["Perfect", "Ed Sheeran"],

  ["Love Yourself", "Justin Bieber"],

  ["Sorry", "Justin Bieber"],

  ["What Makes You Beautiful", "One Direction"],

  ["Sugar", "Maroon 5"],

  ["Girls Like You", "Maroon 5"],

  ["Memories", "Maroon 5"],

  ["Attention", "Charlie Puth"],

  ["We Don't Talk Anymore", "Charlie Puth"],

  ["See You Again", "Wiz Khalifa"],

  ["Stay", "The Kid LAROI & Justin Bieber"],

  ["Dance Monkey", "Tones and I"],

  ["Bad Guy", "Billie Eilish"],

  ["As It Was", "Harry Styles"],

  ["Watermelon Sugar", "Harry Styles"],

  ["Blinding Lights", "The Weeknd"],

  ["Save Your Tears", "The Weeknd"],

  ["Levitating", "Dua Lipa"],

  ["New Rules", "Dua Lipa"],

  ["Don't Start Now", "Dua Lipa"],

  ["Havana", "Camila Cabello"],

  ["Senorita", "Shawn Mendes & Camila Cabello"],

  ["Cheap Thrills", "Sia"],

  ["Roar", "Katy Perry"],

  ["Firework", "Katy Perry"],

  ["Shake It Off", "Taylor Swift"],

  ["Blank Space", "Taylor Swift"],

  ["Anti-Hero", "Taylor Swift"],

  ["Uptown Funk", "Mark Ronson ft. Bruno Mars"],

  ["Just the Way You Are", "Bruno Mars"],

  ["Someone You Loved", "Lewis Capaldi"],

  ["Stitches", "Shawn Mendes"]

];



/* ==================================================
   게임 변수
================================================== */

let teams = [];

let currentTeam = 0;

let boardData = [];

let selectedIndex = -1;

let answered = false;

let usedCount = 0;



/* ==================================================
   팀 추가
================================================== */

function addTeam() {

  const input =
    document.getElementById("teamInput");

  const name =
    input.value.trim();


  if(name === "") {

    alert("팀 이름을 입력하세요!");

    return;

  }


  if(teams.length >= 8) {

    alert("최대 8팀까지 가능합니다!");

    return;

  }


  teams.push({

    name: name,

    score: 0

  });


  input.value = "";

  showTeams();

}



/* ==================================================
   팀 목록 표시
================================================== */

function showTeams() {

  const list =
    document.getElementById("teamList");

  list.innerHTML = "";


  teams.forEach(function(team, index) {

    const box =
      document.createElement("div");

    box.className = "teamBox";

    box.textContent =
      "👥 " +
      (index + 1) +
      "팀 : " +
      team.name;

    list.appendChild(box);

  });

}



/* ==================================================
   화면 전환
================================================== */

function showScreen(screenId) {

  document
    .querySelectorAll(".screen")
    .forEach(function(screen) {

      screen.classList.remove("active");

    });


  document
    .getElementById(screenId)
    .classList.add("active");


  /* 화면이 바뀌면 맨 위로 이동 */

  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}



/* ==================================================
   게임 시작
================================================== */

function startGame() {

  if(teams.length < 2) {

    alert("최소 2팀을 추가하세요!");

    return;

  }


  currentTeam = 0;

  usedCount = 0;

  selectedIndex = -1;

  answered = false;


  createBoard();

  updateTurn();

  updateScores();


  showScreen("boardScreen");

}



/* ==================================================
   보드 생성
================================================== */

function createBoard() {

  const board =
    document.getElementById("board");

  board.innerHTML = "";

  boardData = [];


  /* 35곡 */

  songs.forEach(function(song) {

    boardData.push({

      type: "song",

      title: song[0],

      artist: song[1],

      used: false

    });

  });


  /* 꽝 5개 */

  for(let i = 0; i < 5; i++) {

    boardData.push({

      type: "boom",

      title: "",

      artist: "",

      used: false

    });

  }


  /* =================================================
     전체 40개 랜덤 섞기

     ★ 노래와 정답이 같이 움직이기 때문에
       번호와 정답이 서로 틀어지지 않음
  ================================================= */

  for(
    let i = boardData.length - 1;
    i > 0;
    i--
  ) {

    const randomIndex =
      Math.floor(
        Math.random() * (i + 1)
      );


    const temp =
      boardData[i];

    boardData[i] =
      boardData[randomIndex];

    boardData[randomIndex] =
      temp;

  }


  /* 40개 번호 생성 */

  for(let i = 0; i < 40; i++) {

    const cell =
      document.createElement("div");

    cell.className = "cell";

    cell.textContent = i + 1;


    cell.onclick = function() {

      selectCell(i);

    };


    board.appendChild(cell);

  }

}



/* ==================================================
   번호 선택
================================================== */

function selectCell(index) {

  /* 이미 답변 중이면 번호판으로 다시 못 감 */

  if(selectedIndex !== -1) {

    return;

  }


  if(boardData[index].used) {

    return;

  }


  selectedIndex = index;

  answered = false;


  const data =
    boardData[index];


  data.used = true;

  usedCount++;


  /* 선택된 번호 회색 */

  const cells =
    document.querySelectorAll(".cell");

  cells[index]
    .classList.add("used");


  /* 번호 표시 */

  document.getElementById("questionNumber")
    .textContent =
      "🔢 " +
      (index + 1) +
      "번 문제";


  /* 결과 초기화 */

  document.getElementById("result")
    .innerHTML = "";


  /* 다음 버튼 숨김 */

  document.getElementById("nextButton")
    .style.display = "none";


  /* =================================================
     꽝
  ================================================= */

  if(data.type === "boom") {

    document.getElementById("songArea")
      .style.display = "none";

    document.getElementById("boomArea")
      .style.display = "block";

  }


  /* =================================================
     노래
  ================================================= */

  else {

    document.getElementById("songArea")
      .style.display = "block";

    document.getElementById("boomArea")
      .style.display = "none";

    document.getElementById("answerInput")
      .value = "";

  }


  /* ★ 번호판 → 답변 화면으로 이동 */

  showScreen("questionScreen");


  /* 입력칸 자동 선택 */

  if(data.type === "song") {

    setTimeout(function() {

      document
        .getElementById("answerInput")
        .focus();

    }, 400);

  }

}



/* ==================================================
   유튜브
================================================== */

function openYouTube() {

  if(selectedIndex === -1) {

    return;

  }


  const data =
    boardData[selectedIndex];


  if(data.type !== "song") {

    return;

  }


  const searchText =
    data.title +
    " " +
    data.artist +
    " official music video";


  const url =
    "https://www.youtube.com/results?search_query=" +
    encodeURIComponent(searchText);


  window.open(url, "_blank");

}



/* ==================================================
   정답 확인
================================================== */

function checkAnswer() {

  if(answered) {

    return;

  }


  if(selectedIndex === -1) {

    return;

  }


  const data =
    boardData[selectedIndex];


  const input =
    document
      .getElementById("answerInput")
      .value
      .trim();


  if(input === "") {

    alert("노래 제목을 입력하세요!");

    return;

  }


  /* 대소문자 + 띄어쓰기 무시 */

  const userAnswer =
    normalize(input);


  const correctAnswer =
    normalize(data.title);


  /* =================================================
     정답
  ================================================= */

  if(userAnswer === correctAnswer) {

    teams[currentTeam].score += 2;

    answered = true;


    showEffect("🎉 +2점");


    /* ★ 정답을 화면에 확실하게 표시 */

    document.getElementById("result")
      .innerHTML =

      "<div>🎉 정답!</div>" +

      "<div>+2점</div>" +

      "<div class='correctAnswer'>" +

      "🎵 정답 : " +

      data.title +

      "</div>" +

      "<div>👤 가수 : " +

      data.artist +

      "</div>";


  }


  /* =================================================
     오답
  ================================================= */

  else {

    answered = true;


    showEffect("❌ 0점");


    /* ★ 오답이어도 정답 표시 */

    document.getElementById("result")
      .innerHTML =

      "<div>❌ 오답!</div>" +

      "<div>0점</div>" +

      "<div class='correctAnswer'>" +

      "🎵 정답 : " +

      data.title +

      "</div>" +

      "<div>👤 가수 : " +

      data.artist +

      "</div>";

  }


  updateScores();


  /* 다음 팀 버튼 표시 */

  document.getElementById("nextButton")
    .style.display = "inline-block";

}



/* ==================================================
   정답 비교
================================================== */

function normalize(text) {

  return text

    .toLowerCase()

    .replace(/\s+/g, "");

}



/* ==================================================
   꽝 처리
================================================== */

function boomAnswer() {

  if(answered) {

    return;

  }


  if(selectedIndex === -1) {

    return;

  }


  teams[currentTeam].score -= 1;

  answered = true;


  showEffect("💥 -1점");


  document.getElementById("result")
    .innerHTML =

    "<div>💥 꽝!</div>" +

    "<div>-1점</div>";


  updateScores();


  document.getElementById("nextButton")
    .style.display = "inline-block";

}



/* ==================================================
   다음 팀
================================================== */

function goNextTurn() {

  /* 게임이 끝났으면 종료 화면 */

  if(usedCount >= 40) {

    endGame();

    return;

  }


  /* 다음 팀 */

  currentTeam++;


  if(currentTeam >= teams.length) {

    currentTeam = 0;

  }


  /* 선택 초기화 */

  selectedIndex = -1;

  answered = false;


  updateTurn();


  /* ★ 답변 화면 → 번호판 화면으로 돌아감 */

  showScreen("boardScreen");

}



/* ==================================================
   현재 팀 표시
================================================== */

function updateTurn() {

  document.getElementById("turnText")
    .textContent =

      "🎯 현재 차례 : " +

      teams[currentTeam].name +

      "팀";

}



/* ==================================================
   점수판
================================================== */

function updateScores() {

  const scores =
    document.getElementById("scores");

  scores.innerHTML = "";


  teams.forEach(function(team) {

    const row =
      document.createElement("div");

    row.className = "scoreRow";


    row.innerHTML =

      "<span>👥 " +

      team.name +

      "</span>" +

      "<strong>" +

      team.score +

      "점</strong>";


    scores.appendChild(row);

  });

}



/* ==================================================
   게임 종료
================================================== */

function endGame() {

  const sortedTeams =
    [...teams].sort(function(a, b) {

      return b.score - a.score;

    });


  if(sortedTeams.length > 0) {

    document.getElementById("winner")
      .innerHTML =

      "<h2>🥇 우승팀</h2>" +

      "<h1>" +

      sortedTeams[0].name +

      "팀</h1>" +

      "<h2>" +

      sortedTeams[0].score +

      "점</h2>";

  }


  let finalText =
    "<h2>🏆 최종 점수</h2>";


  sortedTeams.forEach(function(team, index) {

    finalText +=

      (index + 1) +

      "위　" +

      team.name +

      "팀　" +

      team.score +

      "점<br>";

  });


  document.getElementById("finalScores")
    .innerHTML = finalText;


  showScreen("endScreen");

}



/* ==================================================
   큰 점수 효과
================================================== */

function showEffect(text) {

  const effect =
    document.getElementById("effect");


  effect.textContent = text;

  effect.style.display = "flex";


  setTimeout(function() {

    effect.style.display = "none";

  }, 800);

}


</script>

</body>
</html>
