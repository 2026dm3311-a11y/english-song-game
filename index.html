<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎵 POP SONG QUIZ</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  font-family: Arial, sans-serif;
  background: #f4f6fb;
  text-align: center;
}

h1 {
  font-size: 36px;
  margin-bottom: 10px;
}

.setup,
.game {
  max-width: 950px;
  margin: auto;
}

.game {
  display: none;
}

input {
  padding: 12px;
  font-size: 17px;
  border: 2px solid #ccc;
  border-radius: 10px;
  outline: none;
}

button {
  padding: 12px 18px;
  margin: 5px;
  border: none;
  border-radius: 10px;
  font-size: 16px;
  cursor: pointer;
}

button:hover {
  transform: scale(1.04);
}

.add {
  background: #4caf50;
  color: white;
}

.start {
  background: #222;
  color: white;
  font-size: 20px;
  padding: 15px 30px;
}

.youtube {
  background: #ff0000;
  color: white;
  font-size: 18px;
}

.answer {
  background: #2196f3;
  color: white;
}

.boom {
  background: #ff5722;
  color: white;
  font-size: 18px;
}

.next {
  background: #673ab7;
  color: white;
  font-size: 18px;
}

.teamBox {
  display: inline-block;
  background: white;
  padding: 10px 18px;
  margin: 5px;
  border-radius: 10px;
  box-shadow: 0 2px 6px #ccc;
}

#turn {
  font-size: 25px;
  font-weight: bold;
  margin: 20px;
}

#board {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
  margin: 20px auto;
}

.cell {
  background: white;
  border: 3px solid #333;
  border-radius: 12px;
  padding: 22px 5px;
  font-size: 22px;
  font-weight: bold;
  cursor: pointer;
  user-select: none;
}

.cell:hover {
  background: #ddd;
  transform: scale(1.04);
}

.cell.used {
  background: #aaa;
  color: #666;
  cursor: default;
  transform: none;
}

#questionArea {
  display: none;
  background: white;
  max-width: 650px;
  margin: 25px auto;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 3px 12px #ccc;
}

#answerInput {
  width: 70%;
  margin-top: 15px;
}

#result {
  min-height: 80px;
  margin: 20px;
  font-size: 26px;
  font-weight: bold;
  line-height: 1.6;
}

#scoreboard {
  margin-top: 25px;
  padding: 20px;
  background: white;
  border-radius: 18px;
  box-shadow: 0 3px 10px #ccc;
}

.scoreRow {
  display: flex;
  justify-content: space-between;
  background: #eee;
  padding: 12px 18px;
  margin: 7px;
  border-radius: 10px;
  font-size: 20px;
}

#effect {
  position: fixed;
  inset: 0;
  display: none;
  justify-content: center;
  align-items: center;
  z-index: 9999;
  background: rgba(255,255,255,0.92);
  font-size: 75px;
  font-weight: bold;
}

#gameEnd {
  display: none;
  background: white;
  max-width: 650px;
  margin: 30px auto;
  padding: 30px;
  border-radius: 20px;
  box-shadow: 0 3px 12px #ccc;
}

@media(max-width:700px) {
  #board {
    grid-template-columns: repeat(5, 1fr);
  }

  .cell {
    padding: 18px 3px;
    font-size: 19px;
  }

  #answerInput {
    width: 90%;
  }
}
</style>
</head>

<body>

<!-- 시작 화면 -->
<div class="setup" id="setup">

  <h1>🎵 POP SONG QUIZ 🎵</h1>

  <p>🎵 35곡 + 💥 꽝 5개 = 총 40칸</p>

  <p>
    ✅ 정답 +2점　
    ❌ 오답 0점　
    💥 꽝 -1점
  </p>

  <input
    id="teamInput"
    type="text"
    placeholder="팀 이름 입력"
  >

  <button class="add" onclick="addTeam()">
    👥 팀 추가
  </button>

  <div id="teamList"></div>

  <br>

  <button class="start" onclick="startGame()">
    🎮 게임 시작
  </button>

</div>


<!-- 게임 화면 -->
<div class="game" id="game">

  <h1>🎵 POP SONG QUIZ 🎵</h1>

  <div id="turn"></div>

  <div id="board"></div>


  <!-- 문제 영역 -->
  <div id="questionArea">

    <h2 id="numberText"></h2>

    <button
      class="youtube"
      id="youtubeButton"
      onclick="openYouTube()"
    >
      ▶️ 유튜브에서 노래 듣기
    </button>


    <!-- 일반 문제 -->
    <div id="normalArea">

      <br>

      <input
        id="answerInput"
        type="text"
        placeholder="노래 제목 입력"
        onkeydown="if(event.key === 'Enter') checkAnswer()"
      >

      <br>

      <button
        class="answer"
        onclick="checkAnswer()"
      >
        ✅ 정답 확인
      </button>

    </div>


    <!-- 꽝 -->
    <div id="boomArea"></div>


    <!-- 결과 -->
    <div id="result"></div>


    <!-- 다음 팀 -->
    <button
      class="next"
      id="nextButton"
      onclick="nextTurn()"
      style="display:none;"
    >
      ➡️ 다음 팀
    </button>

  </div>


  <!-- 점수판 -->
  <div id="scoreboard">

    <h2>🏆 점수판</h2>

    <div id="scores"></div>

  </div>


  <!-- 게임 종료 -->
  <div id="gameEnd">

    <h2>🏆 게임 종료!</h2>

    <div id="winnerText"></div>

  </div>

</div>


<!-- 큰 점수 효과 -->
<div id="effect"></div>


<script>

/* =========================
   35곡
========================= */

const songs = [

  ["Shape of You", "Ed Sheeran"],
  ["Believer", "Imagine Dragons"],
  ["Counting Stars", "OneRepublic"],
  ["Perfect", "Ed Sheeran"],
  ["Love Yourself", "Justin Bieber"],
  ["Sorry", "Justin Bieber"],
  ["What Makes You Beautiful", "One Direction"],
  ["Sugar", "Maroon 5"],
  ["Girls Like You", "Maroon 5"],
  ["Memories", "Maroon 5"],
  ["Attention", "Charlie Puth"],
  ["We Don't Talk Anymore", "Charlie Puth"],
  ["See You Again", "Wiz Khalifa"],
  ["Stay", "The Kid LAROI & Justin Bieber"],
  ["Dance Monkey", "Tones and I"],
  ["Bad Guy", "Billie Eilish"],
  ["As It Was", "Harry Styles"],
  ["Watermelon Sugar", "Harry Styles"],
  ["Blinding Lights", "The Weeknd"],
  ["Save Your Tears", "The Weeknd"],
  ["Levitating", "Dua Lipa"],
  ["New Rules", "Dua Lipa"],
  ["Don't Start Now", "Dua Lipa"],
  ["Havana", "Camila Cabello"],
  ["Senorita", "Shawn Mendes & Camila Cabello"],
  ["Cheap Thrills", "Sia"],
  ["Roar", "Katy Perry"],
  ["Firework", "Katy Perry"],
  ["Shake It Off", "Taylor Swift"],
  ["Blank Space", "Taylor Swift"],
  ["Anti-Hero", "Taylor Swift"],
  ["Uptown Funk", "Mark Ronson ft. Bruno Mars"],
  ["Just the Way You Are", "Bruno Mars"],
  ["Someone You Loved", "Lewis Capaldi"],
  ["Stitches", "Shawn Mendes"]

];


/* =========================
   게임 변수
========================= */

let teams = [];
let currentTeam = 0;
let boardData = [];
let selectedIndex = -1;
let answered = false;
let questionOpen = false;
let usedCount = 0;


/* =========================
   팀 추가
========================= */

function addTeam() {

  const input = document.getElementById("teamInput");

  const name = input.value.trim();

  if(name === "") {
    alert("팀 이름을 입력하세요!");
    return;
  }

  if(teams.length >= 8) {
    alert("최대 8팀까지 가능합니다!");
    return;
  }

  teams.push({
    name: name,
    score: 0
  });

  input.value = "";

  showTeams();
}


/* =========================
   팀 표시
========================= */

function showTeams() {

  const list = document.getElementById("teamList");

  list.innerHTML = "";

  teams.forEach(function(team, index) {

    const box = document.createElement("div");

    box.className = "teamBox";

    box.textContent =
      "👥 " +
      (index + 1) +
      "팀 : " +
      team.name;

    list.appendChild(box);

  });
}


/* =========================
   게임 시작
========================= */

function startGame() {

  if(teams.length < 2) {

    alert("최소 2팀을 추가하세요!");

    return;
  }

  document.getElementById("setup").style.display = "none";

  document.getElementById("game").style.display = "block";

  createBoard();

  updateTurn();

  updateScores();
}


/* =========================
   보드 생성
========================= */

function createBoard() {

  const board = document.getElementById("board");

  board.innerHTML = "";

  boardData = [];

  usedCount = 0;

  selectedIndex = -1;

  answered = false;

  questionOpen = false;


  // 35곡 추가
  songs.forEach(function(song) {

    boardData.push({

      type: "song",
      title: song[0],
      artist: song[1],
      used: false

    });

  });


  // 꽝 5개 추가
  for(let i = 0; i < 5; i++) {

    boardData.push({

      type: "boom",
      title: null,
      artist: null,
      used: false

    });

  }


  // 40개 전체 랜덤 섞기
  for(let i = boardData.length - 1; i > 0; i--) {

    const randomIndex =
      Math.floor(Math.random() * (i + 1));

    const temp = boardData[i];

    boardData[i] = boardData[randomIndex];

    boardData[randomIndex] = temp;

  }


  // 40개 번호 만들기
  for(let i = 0; i < 40; i++) {

    const cell = document.createElement("div");

    cell.className = "cell";

    cell.textContent = i + 1;

    cell.onclick = function() {

      selectCell(i);

    };

    board.appendChild(cell);

  }
}


/* =========================
   번호 선택
========================= */

function selectCell(index) {

  // 이미 문제가 열려 있으면 다른 번호 선택 불가
  if(questionOpen) {
    return;
  }

  if(boardData[index].used) {
    return;
  }

  selectedIndex = index;

  const data = boardData[index];

  data.used = true;

  usedCount++;

  questionOpen = true;

  answered = false;

  const cells = document.querySelectorAll(".cell");

  cells[index].classList.add("used");


  document.getElementById("questionArea").style.display = "block";

  document.getElementById("numberText").textContent =
    "🔢 " + (index + 1) + "번";

  document.getElementById("result").textContent = "";

  document.getElementById("nextButton").style.display = "none";


  // 꽝
  if(data.type === "boom") {

    document.getElementById("youtubeButton").style.display = "none";

    document.getElementById("normalArea").style.display = "none";

    document.getElementById("boomArea").innerHTML =

      "<p style='font-size:40px;font-weight:bold;'>💥 꽝!</p>" +

      "<button class='boom' onclick='boomAnswer()'>" +
      "💥 꽝 처리 (-1점)" +
      "</button>";

    return;
  }


  // 노래
  document.getElementById("youtubeButton").style.display = "inline-block";

  document.getElementById("normalArea").style.display = "block";

  document.getElementById("boomArea").innerHTML = "";

  document.getElementById("answerInput").value = "";

  document.getElementById("answerInput").focus();

}


/* =========================
   유튜브 검색
========================= */

function openYouTube() {

  if(selectedIndex === -1) {
    return;
  }

  const data = boardData[selectedIndex];

  if(data.type !== "song") {
    return;
  }

  const query =
    data.title +
    " " +
    data.artist +
    " official music video";

  const url =
    "https://www.youtube.com/results?search_query=" +
    encodeURIComponent(query);

  window.open(url, "_blank");
}


/* =========================
   정답 확인
========================= */

function checkAnswer() {

  if(answered) {
    return;
  }

  if(selectedIndex === -1) {
    return;
  }

  const data = boardData[selectedIndex];

  if(data.type !== "song") {
    return;
  }

  const input =
    document.getElementById("answerInput").value;

  if(input.trim() === "") {

    alert("노래 제목을 입력하세요!");

    return;
  }


  // 대소문자 + 띄어쓰기 무시
  const userAnswer = normalize(input);

  const correctAnswer = normalize(data.title);


  // 정답
  if(userAnswer === correctAnswer) {

    teams[currentTeam].score += 2;

    answered = true;

    showEffect("🎉 +2점");

    document.getElementById("result").innerHTML =

      "🎉 정답! <strong>+2점</strong><br>" +

      "🎵 정답: <strong>" +
      data.title +
      "</strong><br>" +

      "👤 가수: " +
      data.artist;

  }

  // 오답
  else {

    answered = true;

    showEffect("❌ 0점");

    document.getElementById("result").innerHTML =

      "❌ 오답! <strong>0점</strong><br>" +

      "🎵 정답: <strong>" +
      data.title +
      "</strong><br>" +

      "👤 가수: " +
      data.artist;

  }


  updateScores();

  document.getElementById("nextButton").style.display =
    "inline-block";
}


/* =========================
   정답 비교
========================= */

function normalize(text) {

  return text
    .toLowerCase()
    .replace(/\s+/g, "")
    .trim();

}


/* =========================
   꽝 처리
========================= */

function boomAnswer() {

  if(answered) {
    return;
  }

  teams[currentTeam].score -= 1;

  answered = true;

  showEffect("💥 -1점");

  document.getElementById("result").innerHTML =

    "💥 꽝! <strong>-1점</strong>";

  document.getElementById("nextButton").style.display =
    "inline-block";

  updateScores();
}


/* =========================
   다음 팀
========================= */

function nextTurn() {

  document.getElementById("questionArea").style.display = "none";

  document.getElementById("answerInput").value = "";

  document.getElementById("boomArea").innerHTML = "";

  document.getElementById("result").textContent = "";

  document.getElementById("nextButton").style.display = "none";

  selectedIndex = -1;

  answered = false;

  questionOpen = false;


  // 자동 팀 순서
  currentTeam++;

  if(currentTeam >= teams.length) {
    currentTeam = 0;
  }


  updateTurn();


  // 40칸 모두 사용
  if(usedCount >= 40) {

    endGame();

  }

}


/* =========================
   현재 팀 표시
========================= */

function updateTurn() {

  document.getElementById("turn").textContent =

    "🎯 현재 차례 : " +
    teams[currentTeam].name +
    "팀";

}


/* =========================
   점수판
========================= */

function updateScores() {

  const scores = document.getElementById("scores");

  scores.innerHTML = "";

  teams.forEach(function(team) {

    const row = document.createElement("div");

    row.className = "scoreRow";

    row.innerHTML =

      "<span>👥 " +
      team.name +
      "</span>" +

      "<strong>" +
      team.score +
      "점" +
      "</strong>";

    scores.appendChild(row);

  });
}


/* =========================
   게임 종료
========================= */

function endGame() {

  document.getElementById("questionArea").style.display = "none";

  document.getElementById("gameEnd").style.display = "block";

  let sortedTeams = [...teams].sort(function(a, b) {
    return b.score - a.score;
  });

  let text = "";

  if(sortedTeams.length > 0) {

    text +=
      "🥇 우승 : <strong>" +
      sortedTeams[0].name +
      "팀</strong><br>" +
      sortedTeams[0].score +
      "점<br><br>";

  }

  text += "<h3>최종 점수</h3>";

  sortedTeams.forEach(function(team, index) {

    text +=
      (index + 1) +
      "위 - " +
      team.name +
      "팀 : " +
      team.score +
      "점<br>";

  });

  document.getElementById("winnerText").innerHTML = text;

}


/* =========================
   큰 점수 효과
========================= */

function showEffect(text) {

  const effect = document.getElementById("effect");

  effect.textContent = text;

  effect.style.display = "flex";

  setTimeout(function() {

    effect.style.display = "none";

  }, 900);

}

</script>

</body>
</html>
