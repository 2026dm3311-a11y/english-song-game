<!DOCTYPE html>
<html lang="ko">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>English Song Game</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    padding: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #141e30, #243b55);
    color: white;
    min-height: 100vh;
}

button {
    cursor: pointer;
}

.screen {
    display: none;
    min-height: 100vh;
    padding: 30px 20px;
}

.screen.active {
    display: block;
}

.container {
    width: 100%;
    max-width: 1100px;
    margin: 0 auto;
}

h1 {
    text-align: center;
    font-size: 42px;
    margin-bottom: 30px;
}

h2 {
    text-align: center;
    margin-bottom: 25px;
}

.team-input-area {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-bottom: 20px;
}

.team-input-area input {
    width: 300px;
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 18px;
}

.team-input-area button {
    padding: 14px 22px;
    border: none;
    border-radius: 10px;
    background: #4caf50;
    color: white;
    font-size: 18px;
    font-weight: bold;
}

.team-list {
    max-width: 500px;
    margin: 20px auto;
}

.team-item {
    background: rgba(255,255,255,0.12);
    padding: 15px;
    border-radius: 10px;
    margin-bottom: 10px;
    text-align: center;
    font-size: 20px;
}

.start-button {
    display: block;
    margin: 30px auto;
    padding: 18px 45px;
    border: none;
    border-radius: 15px;
    background: #ff9800;
    color: white;
    font-size: 24px;
    font-weight: bold;
}

.current-turn {
    text-align: center;
    font-size: 25px;
    font-weight: bold;
    margin-bottom: 25px;
}

.board {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 12px;
    max-width: 900px;
    margin: 0 auto 30px;
}

.cell {
    aspect-ratio: 1 / 1;
    border: none;
    border-radius: 15px;
    background: linear-gradient(145deg, #2196f3, #1565c0);
    color: white;
    font-size: 28px;
    font-weight: bold;
    transition: 0.2s;
}

.cell:hover {
    transform: scale(1.05);
}

.cell.used {
    background: #555;
    opacity: 0.5;
    cursor: not-allowed;
}

.scoreboard {
    max-width: 700px;
    margin: 0 auto;
    background: rgba(255,255,255,0.08);
    border-radius: 15px;
    padding: 20px;
}

.scoreboard h2 {
    margin-top: 0;
}

.score-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 12px 15px;
    margin-bottom: 8px;
    background: rgba(255,255,255,0.1);
    border-radius: 10px;
    font-size: 20px;
}

.score-row.current {
    background: rgba(255,152,0,0.4);
}

.question-container {
    max-width: 700px;
    margin: 0 auto;
    text-align: center;
}

.question-number {
    font-size: 32px;
    font-weight: bold;
    margin-bottom: 15px;
}

.answer-input {
    width: 100%;
    padding: 18px;
    font-size: 22px;
    border-radius: 12px;
    border: none;
    margin: 20px 0;
    text-align: center;
}

.answer-button {
    padding: 15px 35px;
    border: none;
    border-radius: 12px;
    background: #4caf50;
    color: white;
    font-size: 21px;
    font-weight: bold;
}

.youtube-button {
    padding: 15px 30px;
    border: none;
    border-radius: 12px;
    background: #ff0000;
    color: white;
    font-size: 19px;
    font-weight: bold;
    margin-top: 15px;
}

.result {
    font-size: 32px;
    font-weight: bold;
    margin: 25px 0;
    min-height: 45px;
}

.correct-answer-box {
    display: none;
    background: rgba(255,255,255,0.1);
    border-radius: 15px;
    padding: 20px;
    margin: 20px 0;
}

.correct-answer-box h3 {
    margin-top: 0;
    font-size: 22px;
}

.correct-title {
    font-size: 30px;
    font-weight: bold;
    margin: 10px 0;
}

.correct-artist {
    font-size: 20px;
    opacity: 0.8;
}

.next-area {
    display: none;
    margin-top: 25px;
}

.next-button {
    padding: 17px 40px;
    border: none;
    border-radius: 12px;
    background: #ff9800;
    color: white;
    font-size: 22px;
    font-weight: bold;
}

.score-effect {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 90px;
    font-weight: bold;
    z-index: 9999;
    pointer-events: none;
    text-shadow:
        0 0 15px rgba(255,255,255,0.8),
        0 0 30px rgba(255,255,255,0.5);
}

.score-effect.show {
    animation: scorePop 1.2s ease-out forwards;
}

@keyframes scorePop {

    0% {
        transform:
            translate(-50%, -50%)
            scale(0);
        opacity: 0;
    }

    20% {
        transform:
            translate(-50%, -50%)
            scale(1.4);
        opacity: 1;
    }

    50% {
        transform:
            translate(-50%, -50%)
            scale(1);
        opacity: 1;
    }

    100% {
        transform:
            translate(-50%, -50%)
            scale(1.1);
        opacity: 0;
    }

}

.end-container {
    max-width: 800px;
    margin: 0 auto;
    text-align: center;
}

.final-score {
    background: rgba(255,255,255,0.1);
    padding: 20px;
    border-radius: 15px;
    margin: 15px 0;
    font-size: 25px;
}

.restart-button {
    margin-top: 30px;
    padding: 18px 40px;
    border: none;
    border-radius: 12px;
    background: #2196f3;
    color: white;
    font-size: 22px;
    font-weight: bold;
}

@media (max-width: 700px) {

    h1 {
        font-size: 30px;
    }

    .board {
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
    }

    .cell {
        font-size: 20px;
    }

    .score-effect {
        font-size: 65px;
    }

}

</style>

</head>

<body>

<!-- 점수 효과 -->

<div id="scoreEffect" class="score-effect"></div>


<!-- 효과음 -->

<audio id="correctSound" preload="auto">
    <source
        src="https://actions.google.com/sounds/v1/cartoon/clang_and_wobble.ogg"
        type="audio/ogg">
</audio>

<audio id="wrongSound" preload="auto">
    <source
        src="https://actions.google.com/sounds/v1/cartoon/cartoon_boing.ogg"
        type="audio/ogg">
</audio>

<audio id="boomSound" preload="auto">
    <source
        src="https://actions.google.com/sounds/v1/cartoon/wood_plank_flicks.ogg"
        type="audio/ogg">
</audio>


<!-- =========================
     시작 화면
========================= -->

<section id="startScreen" class="screen active">

    <div class="container">

        <h1>🎵 English Song Game 🎵</h1>

        <h2>팀을 추가해주세요</h2>

        <div class="team-input-area">

            <input
                type="text"
                id="teamInput"
                placeholder="팀 이름 입력">

            <button onclick="addTeam()">
                팀 추가
            </button>

        </div>

        <div id="teamList" class="team-list"></div>

        <button
            class="start-button"
            onclick="startGame()">

            게임 시작

        </button>

    </div>

</section>


<!-- =========================
     게임 보드
========================= -->

<section id="boardScreen" class="screen">

    <div class="container">

        <h1>🎵 English Song Game</h1>

        <div
            id="turnDisplay"
            class="current-turn">
        </div>

        <div
            id="gameBoard"
            class="board">
        </div>

        <div class="scoreboard">

            <h2>🏆 점수판</h2>

            <div id="scoreboardList"></div>

        </div>

    </div>

</section>


<!-- =========================
     문제 화면
========================= -->

<section id="questionScreen" class="screen">

    <div class="question-container">

        <div
            id="questionNumber"
            class="question-number">
        </div>

        <div
            id="currentTeam"
            class="current-turn">
        </div>

        <button
            class="youtube-button"
            onclick="openYouTube()">

            ▶️ YouTube에서 노래 듣기

        </button>

        <input
            type="text"
            id="answerInput"
            class="answer-input"
            placeholder="노래 제목을 입력하세요">

        <button
            id="answerButton"
            class="answer-button"
            onclick="checkAnswer()">

            정답 확인

        </button>

        <div
            id="result"
            class="result">
        </div>

        <div
            id="correctAnswerBox"
            class="correct-answer-box">

            <h3>정답</h3>

            <div
                id="correctTitle"
                class="correct-title">
            </div>

            <div
                id="correctArtist"
                class="correct-artist">
            </div>

        </div>

        <div
            id="nextArea"
            class="next-area">

            <button
                class="next-button"
                onclick="goNextTurn()">

                다음 팀

            </button>

        </div>

    </div>

</section>


<!-- =========================
     결과 화면
========================= -->

<section id="endScreen" class="screen">

    <div class="end-container">

        <h1>🎉 게임 종료! 🎉</h1>

        <h2>최종 점수</h2>

        <div id="finalScores"></div>

        <button
            class="restart-button"
            onclick="location.reload()">

            다시 시작

        </button>

    </div>

</section>


<script>

let teams = [];

let currentTeamIndex = 0;

let gameStarted = false;

let selectedIndex = -1;

let gameBoard = [];


/* ==========================================
   노래 목록
========================================== */

const songs = [

    {
        title: "Shape of You",
        artist: "Ed Sheeran"
    },

    {
        title: "Believer",
        artist: "Imagine Dragons"
    },

    {
        title: "Counting Stars",
        artist: "OneRepublic"
    },

    {
        title: "Perfect",
        artist: "Ed Sheeran"
    },

    {
        title: "Love Yourself",
        artist: "Justin Bieber"
    },

    {
        title: "Sorry",
        artist: "Justin Bieber"
    },

    {
        title: "What Makes You Beautiful",
        artist: "One Direction"
    },

    {
        title: "Sugar",
        artist: "Maroon 5"
    },

    {
        title: "Girls Like You",
        artist: "Maroon 5"
    },

    {
        title: "Memories",
        artist: "Maroon 5"
    },

    {
        title: "Attention",
        artist: "Charlie Puth"
    },

    {
        title: "We Don't Talk Anymore",
        artist: "Charlie Puth"
    },

    {
        title: "See You Again",
        artist: "Wiz Khalifa ft. Charlie Puth"
    },

    {
        title: "Stay",
        artist: "The Kid LAROI & Justin Bieber"
    },

    {
        title: "Dance Monkey",
        artist: "Tones and I"
    },

    {
        title: "Bad Guy",
        artist: "Billie Eilish"
    },

    {
        title: "As It Was",
        artist: "Harry Styles"
    },

    {
        title: "Watermelon Sugar",
        artist: "Harry Styles"
    },

    {
        title: "Blinding Lights",
        artist: "The Weeknd"
    },

    {
        title: "Save Your Tears",
        artist: "The Weeknd"
    },

    {
        title: "Levitating",
        artist: "Dua Lipa"
    },

    {
        title: "New Rules",
        artist: "Dua Lipa"
    },

    {
        title: "Don't Start Now",
        artist: "Dua Lipa"
    },

    {
        title: "Havana",
        artist: "Camila Cabello"
    },

    {
        title: "Senorita",
        artist: "Shawn Mendes & Camila Cabello"
    },

    {
        title: "Cheap Thrills",
        artist: "Sia"
    },

    {
        title: "Roar",
        artist: "Katy Perry"
    },

    {
        title: "Firework",
        artist: "Katy Perry"
    },

    {
        title: "Shake It Off",
        artist: "Taylor Swift"
    },

    {
        title: "Blank Space",
        artist: "Taylor Swift"
    },

    {
        title: "Anti-Hero",
        artist: "Taylor Swift"
    },

    {
        title: "Uptown Funk",
        artist: "Mark Ronson ft. Bruno Mars"
    },

    {
        title: "Just the Way You Are",
        artist: "Bruno Mars"
    },

    {
        title: "Someone You Loved",
        artist: "Lewis Capaldi"
    },

    {
        title: "Stitches",
        artist: "Shawn Mendes"
    }

];
/* ==========================================
   팀 추가
========================================== */

function addTeam() {

    const input = document.getElementById("teamInput");

    const name = input.value.trim();

    if (!name) {
        alert("팀 이름을 입력해주세요.");
        return;
    }

    teams.push({
        name: name,
        score: 0
    });

    input.value = "";

    renderTeams();
}


/* ==========================================
   팀 목록 표시
========================================== */

function renderTeams() {

    const list = document.getElementById("teamList");

    list.innerHTML = "";

    teams.forEach((team, index) => {

        const div = document.createElement("div");

        div.className = "team-item";

        div.textContent =
            `${index + 1}팀 : ${team.name}`;

        list.appendChild(div);

    });
}


/* ==========================================
   게임 시작
========================================== */

function startGame() {

    if (teams.length < 1) {

        alert("팀을 하나 이상 추가해주세요.");

        return;
    }

    gameStarted = true;

    currentTeamIndex = 0;

    selectedIndex = -1;

    createBoard();

    renderBoard();

    renderScoreboard();

    updateTurnDisplay();

    showScreen("boardScreen");
}


/* ==========================================
   보드 생성
   노래 35개 + 꽝 5개
========================================== */

function createBoard() {

    gameBoard = [];

    songs.forEach((song) => {

        gameBoard.push({

            type: "song",

            title: song.title,

            artist: song.artist,

            used: false

        });

    });


    for (let i = 0; i < 5; i++) {

        gameBoard.push({

            type: "boom",

            title: "꽝",

            artist: "",

            used: false

        });

    }


    /* 전체 40칸을 랜덤 섞기 */

    for (
        let i = gameBoard.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [
            gameBoard[i],
            gameBoard[j]
        ] =
        [
            gameBoard[j],
            gameBoard[i]
        ];

    }

}


/* ==========================================
   보드 표시
========================================== */

function renderBoard() {

    const board =
        document.getElementById("gameBoard");

    board.innerHTML = "";


    gameBoard.forEach((cell, index) => {

        const button =
            document.createElement("button");

        button.className = "cell";

        button.textContent = index + 1;


        if (cell.used) {

            button.classList.add("used");

            button.disabled = true;

        }
        else {

            button.onclick =
                () => selectCell(index);

        }


        board.appendChild(button);

    });

}


/* ==========================================
   현재 팀 표시
========================================== */

function updateTurnDisplay() {

    if (!teams.length) {
        return;
    }

    const team =
        teams[currentTeamIndex];

    document.getElementById("turnDisplay")
        .textContent =
        `현재 차례 : ${team.name}`;

}


/* ==========================================
   점수판 표시
========================================== */

function renderScoreboard() {

    const list =
        document.getElementById("scoreboardList");

    list.innerHTML = "";


    teams.forEach((team, index) => {

        const row =
            document.createElement("div");

        row.className = "score-row";


        if (index === currentTeamIndex) {

            row.classList.add("current");

        }


        row.innerHTML = `

            <span>
                ${index + 1}팀 : ${team.name}
            </span>

            <strong>
                ${team.score}점
            </strong>

        `;


        list.appendChild(row);

    });

}


/* ==========================================
   칸 선택
========================================== */

function selectCell(index) {

    if (selectedIndex !== -1) {
        return;
    }


    const cell = gameBoard[index];


    if (cell.used) {
        return;
    }


    cell.used = true;


    /*
     * 💥 꽝 처리
     *
     * 꽝을 누르면 문제 화면으로 가지 않고
     * 바로 -1점을 적용하고 다음 팀으로 넘어감
     */

    if (cell.type === "boom") {

        teams[currentTeamIndex].score -= 1;


        renderBoard();

        renderScoreboard();


        showScoreEffect("💥 꽝! -1점");


        const boomSound =
            document.getElementById("boomSound");

        boomSound.currentTime = 0;

        boomSound.play().catch(() => {});


        setTimeout(() => {

            goNextTurn();

        }, 1200);


        return;
    }


    /*
     * 일반 노래 문제
     */

    selectedIndex = index;


    document.getElementById("questionNumber")
        .textContent =
        `${index + 1}번 노래`;


    document.getElementById("currentTeam")
        .textContent =
        `현재 팀 : ${teams[currentTeamIndex].name}`;


    document.getElementById("answerInput").value = "";


    document.getElementById("result")
        .textContent = "";


    document.getElementById("correctAnswerBox")
        .style.display = "none";


    document.getElementById("nextArea")
        .style.display = "none";


    document.getElementById("answerButton")
        .disabled = false;


    showScreen("questionScreen");

}
/* ==========================================
   대소문자 / 띄어쓰기 / 기호 무시
========================================== */

function normalize(text) {

    return String(text)
        .toLowerCase()
        .replace(/[^a-z]/g, "");

}


/* ==========================================
   정답 확인
========================================== */

function checkAnswer() {

    if (selectedIndex === -1) {
        return;
    }


    const cell =
        gameBoard[selectedIndex];


    const input =
        document.getElementById("answerInput");


    const userAnswer =
        input.value;


    const result =
        document.getElementById("result");


    const answerBox =
        document.getElementById("correctAnswerBox");


    const correctTitle =
        document.getElementById("correctTitle");


    const correctArtist =
        document.getElementById("correctArtist");


    const answerButton =
        document.getElementById("answerButton");


    const nextArea =
        document.getElementById("nextArea");


    /* 정답 표시 */

    correctTitle.textContent =
        cell.title;

    correctArtist.textContent =
        cell.artist;


    answerBox.style.display = "block";


    /*
     * 정답 비교
     *
     * 대문자/소문자 무시
     * 띄어쓰기 무시
     * -, ', _, &, 쉼표 등 모든 기호 무시
     * 영어 알파벳만 비교
     */

    if (
        normalize(userAnswer) ===
        normalize(cell.title)
    ) {

        /* 정답 */

        teams[currentTeamIndex].score += 2;


        result.textContent =
            "🎉 정답! +2점";


        showScoreEffect("🎉 +2");


        const correctSound =
            document.getElementById("correctSound");

        correctSound.currentTime = 0;

        correctSound.play().catch(() => {});


    }
    else {

        /* 오답 */

        result.textContent =
            "❌ 오답! 0점";


        showScoreEffect("❌ 0");

        const wrongSound =
            document.getElementById("wrongSound");

        wrongSound.currentTime = 0;

        wrongSound.play().catch(() => {});

    }


    answerButton.disabled = true;


    nextArea.style.display = "block";


    renderScoreboard();

}


/* ==========================================
   YouTube 열기
========================================== */

function openYouTube() {

    if (selectedIndex === -1) {
        return;
    }


    const cell =
        gameBoard[selectedIndex];


    const query =
        encodeURIComponent(
            cell.title + " " + cell.artist
        );


    window.open(
        "https://www.youtube.com/results?search_query="
        + query,
        "_blank"
    );

}


/* ==========================================
   점수 효과
========================================== */

function showScoreEffect(text) {

    const effect =
        document.getElementById("scoreEffect");


    effect.textContent = text;


    effect.classList.remove("show");


    /*
     * 애니메이션을 다시 실행하기 위한
     * 강제 reflow
     */

    void effect.offsetWidth;


    effect.classList.add("show");


    setTimeout(() => {

        effect.classList.remove("show");

    }, 1200);

}


/* ==========================================
   화면 전환
========================================== */

function showScreen(screenId) {

    document
        .querySelectorAll(".screen")
        .forEach(screen => {

            screen.classList.remove("active");

        });


    document
        .getElementById(screenId)
        .classList.add("active");


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* ==========================================
   다음 팀
========================================== */

function goNextTurn() {

    selectedIndex = -1;


    /*
     * 현재 팀 다음 팀으로 변경
     */

    currentTeamIndex =
        (currentTeamIndex + 1)
        % teams.length;


    /*
     * 모든 칸을 사용했는지 확인
     */

    const allUsed =
        gameBoard.every(cell => cell.used);


    if (allUsed) {

        showFinalScores();

        showScreen("endScreen");

        return;

    }


    /*
     * 다음 팀의 차례로 보드 화면으로 이동
     */

    renderBoard();

    renderScoreboard();

    updateTurnDisplay();

    showScreen("boardScreen");

}


/* ==========================================
   최종 점수
========================================== */

function showFinalScores() {

    const container =
        document.getElementById("finalScores");


    container.innerHTML = "";


    /*
     * 점수순으로 정렬
     * 원래 팀 배열은 변경하지 않음
     */

    const sortedTeams =
        [...teams].sort(
            (a, b) => b.score - a.score
        );


    sortedTeams.forEach((team, index) => {

        const div =
            document.createElement("div");


        div.className =
            "final-score";


        div.textContent =
            `${index + 1}위  ${team.name} : ${team.score}점`;


        container.appendChild(div);

    });

}
