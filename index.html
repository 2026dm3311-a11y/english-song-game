<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Song Game</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    color: white;
}

.screen {
    display: none;
    min-height: 100vh;
    padding: 30px 20px;
}

.screen.active {
    display: block;
}

.container {
    max-width: 1000px;
    margin: 0 auto;
    text-align: center;
}

h1 {
    font-size: 45px;
    margin: 20px 0;
}

h2 {
    font-size: 32px;
}

button {
    border: none;
    border-radius: 12px;
    padding: 14px 22px;
    font-size: 17px;
    font-weight: bold;
    cursor: pointer;
    margin: 5px;
    transition: 0.2s;
}

button:hover {
    transform: scale(1.05);
}

input {
    padding: 14px;
    border-radius: 10px;
    border: none;
    font-size: 17px;
    width: 280px;
    max-width: 90%;
    margin: 5px;
}

.primary {
    background: white;
    color: #5a4fcf;
}

.green {
    background: #2ecc71;
    color: white;
}

.red {
    background: #e74c3c;
    color: white;
}

.yellow {
    background: #f1c40f;
    color: black;
}

.blue {
    background: #3498db;
    color: white;
}

.dark {
    background: #2c3e50;
    color: white;
}

/* 시작 화면 */

.team-input-area {
    margin-top: 40px;
}

.team-list {
    margin: 20px auto;
    max-width: 500px;
}

.team-item {
    background: rgba(255,255,255,0.15);
    padding: 15px;
    margin: 8px;
    border-radius: 12px;
    font-size: 20px;
}

/* 점수판 */

.scoreboard {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 12px;
    margin: 20px 0;
}

.score-card {
    background: rgba(255,255,255,0.18);
    border-radius: 15px;
    padding: 12px 20px;
    min-width: 140px;
}

.score-card.current {
    background: white;
    color: #5a4fcf;
    transform: scale(1.05);
}

.score-name {
    font-size: 18px;
    font-weight: bold;
}

.score-value {
    font-size: 28px;
    font-weight: bold;
    margin-top: 5px;
}

/* 보드 */

.board {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 10px;
    margin-top: 25px;
}

.cell {
    background: white;
    color: #4b45a0;
    border-radius: 12px;
    min-height: 75px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 25px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
}

.cell:hover {
    transform: scale(1.05);
}

.cell.used {
    background: rgba(255,255,255,0.3);
    color: rgba(255,255,255,0.7);
    cursor: not-allowed;
}

.turn-info {
    font-size: 22px;
    margin: 15px;
    font-weight: bold;
}

/* 문제 화면 */

.question-box {
    background: rgba(255,255,255,0.15);
    border-radius: 20px;
    padding: 30px;
    max-width: 700px;
    margin: 30px auto;
}

.question-number {
    font-size: 25px;
    margin-bottom: 15px;
}

.current-team {
    font-size: 24px;
    font-weight: bold;
}

.answer-area {
    margin-top: 30px;
}

.result {
    font-size: 32px;
    font-weight: bold;
    margin: 25px 0;
    min-height: 45px;
}

.correct-answer {
    background: rgba(0,0,0,0.2);
    border-radius: 15px;
    padding: 20px;
    margin-top: 20px;
}

.correct-title {
    font-size: 28px;
    font-weight: bold;
}

.artist {
    font-size: 18px;
    margin-top: 8px;
}

/* 점수 효과 */

.score-effect {
    position: fixed;
    left: 50%;
    top: 50%;
    transform: translate(-50%, -50%) scale(0);
    font-size: 90px;
    font-weight: bold;
    z-index: 999;
    pointer-events: none;
    opacity: 0;
}

.score-effect.show {
    animation: scorePop 1.2s ease forwards;
}

@keyframes scorePop {
    0% {
        transform: translate(-50%, -50%) scale(0);
        opacity: 0;
    }

    30% {
        transform: translate(-50%, -50%) scale(1.3);
        opacity: 1;
    }

    70% {
        transform: translate(-50%, -50%) scale(1);
        opacity: 1;
    }

    100% {
        transform: translate(-50%, -50%) scale(1.5);
        opacity: 0;
    }
}

/* 종료 화면 */

.final-ranking {
    max-width: 600px;
    margin: 30px auto;
}

.final-item {
    background: rgba(255,255,255,0.18);
    padding: 18px;
    margin: 10px;
    border-radius: 15px;
    font-size: 22px;
}

/* 반응형 */

@media (max-width: 700px) {

    h1 {
        font-size: 35px;
    }

    .board {
        grid-template-columns: repeat(5, 1fr);
        gap: 7px;
    }

    .cell {
        min-height: 60px;
        font-size: 20px;
    }

    .score-card {
        min-width: 120px;
    }

    .score-effect {
        font-size: 65px;
    }
}
</style>
</head>

<body>

<!-- 점수 효과 -->
<div id="scoreEffect" class="score-effect"></div>


<!-- =========================
     시작 화면
========================= -->

<section id="startScreen" class="screen active">

    <div class="container">

        <h1>🎵 English Song Game 🎵</h1>

        <h2>팀을 추가해주세요</h2>

        <div class="team-input-area">

            <input
                type="text"
                id="teamInput"
                placeholder="팀 이름 입력"
                onkeydown="if(event.key === 'Enter') addTeam()"
            >

            <button class="primary" onclick="addTeam()">
                팀 추가
            </button>

        </div>

        <div id="teamList" class="team-list"></div>

        <button
            class="green"
            onclick="startGame()"
        >
            게임 시작
        </button>

    </div>

</section>


<!-- =========================
     게임 보드
========================= -->

<section id="boardScreen" class="screen">

    <div class="container">

        <h1>🎵 English Song Game</h1>

        <div id="scoreboard" class="scoreboard"></div>

        <div id="turnInfo" class="turn-info"></div>

        <div id="board" class="board"></div>

    </div>

</section>


<!-- =========================
     문제 화면
========================= -->

<section id="questionScreen" class="screen">

    <div class="container">

        <h1>🎵 Song Question</h1>

        <div class="question-box">

            <div
                id="questionNumber"
                class="question-number"
            ></div>

            <div
                id="currentTeam"
                class="current-team"
            ></div>

            <div class="answer-area">

                <input
                    type="text"
                    id="answerInput"
                    placeholder="노래 제목을 입력하세요"
                    onkeydown="if(event.key === 'Enter') checkAnswer()"
                >

                <br>

                <button
                    class="green"
                    onclick="checkAnswer()"
                    id="answerButton"
                >
                    정답 확인
                </button>

                <button
                    class="red"
                    onclick="openYouTube()"
                >
                    🎵 YouTube에서 듣기
                </button>

            </div>

            <div
                id="result"
                class="result"
            ></div>

            <div
                id="correctAnswerBox"
                class="correct-answer"
                style="display:none;"
            >

                <div>
                    정답
                </div>

                <div
                    id="correctTitle"
                    class="correct-title"
                ></div>

                <div
                    id="correctArtist"
                    class="artist"
                ></div>

            </div>

            <div id="nextArea" style="display:none; margin-top:25px;">

                <button
                    class="blue"
                    onclick="goNextTurn()"
                >
                    다음 팀 →
                </button>

            </div>

        </div>

    </div>

</section>


<!-- =========================
     종료 화면
========================= -->

<section id="endScreen" class="screen">

    <div class="container">

        <h1>🏆 게임 종료!</h1>

        <h2>최종 점수</h2>

        <div
            id="finalRanking"
            class="final-ranking"
        ></div>

        <button
            class="primary"
            onclick="location.reload()"
        >
            다시 시작
        </button>

    </div>

</section>


<script>

/* ==========================================
   노래 데이터
========================================== */

const songs = [

    {
        title: "Shape of You",
        artist: "Ed Sheeran"
    },

    {
        title: "Believer",
        artist: "Imagine Dragons"
    },

    {
        title: "Counting Stars",
        artist: "OneRepublic"
    },

    {
        title: "Perfect",
        artist: "Ed Sheeran"
    },

    {
        title: "Love Yourself",
        artist: "Justin Bieber"
    },

    {
        title: "Sorry",
        artist: "Justin Bieber"
    },

    {
        title: "What Makes You Beautiful",
        artist: "One Direction"
    },

    {
        title: "Sugar",
        artist: "Maroon 5"
    },

    {
        title: "Girls Like You",
        artist: "Maroon 5"
    },

    {
        title: "Memories",
        artist: "Maroon 5"
    },

    {
        title: "Attention",
        artist: "Charlie Puth"
    },

    {
        title: "We Don't Talk Anymore",
        artist: "Charlie Puth"
    },

    {
        title: "See You Again",
        artist: "Wiz Khalifa ft. Charlie Puth"
    },

    {
        title: "Stay",
        artist: "The Kid LAROI & Justin Bieber"
    },

    {
        title: "Dance Monkey",
        artist: "Tones and I"
    },

    {
        title: "Bad Guy",
        artist: "Billie Eilish"
    },

    {
        title: "As It Was",
        artist: "Harry Styles"
    },

    {
        title: "Watermelon Sugar",
        artist: "Harry Styles"
    },

    {
        title: "Blinding Lights",
        artist: "The Weeknd"
    },

    {
        title: "Save Your Tears",
        artist: "The Weeknd"
    },

    {
        title: "Levitating",
        artist: "Dua Lipa"
    },

    {
        title: "New Rules",
        artist: "Dua Lipa"
    },

    {
        title: "Don't Start Now",
        artist: "Dua Lipa"
    },

    {
        title: "Havana",
        artist: "Camila Cabello"
    },

    {
        title: "Senorita",
        artist: "Shawn Mendes & Camila Cabello"
    },

    {
        title: "Cheap Thrills",
        artist: "Sia"
    },

    {
        title: "Roar",
        artist: "Katy Perry"
    },

    {
        title: "Firework",
        artist: "Katy Perry"
    },

    {
        title: "Shake It Off",
        artist: "Taylor Swift"
    },

    {
        title: "Blank Space",
        artist: "Taylor Swift"
    },

    {
        title: "Anti-Hero",
        artist: "Taylor Swift"
    },

    {
        title: "Uptown Funk",
        artist: "Mark Ronson ft. Bruno Mars"
    },

    {
        title: "Just the Way You Are",
        artist: "Bruno Mars"
    },

    {
        title: "Someone You Loved",
        artist: "Lewis Capaldi"
    },

    {
        title: "Stitches",
        artist: "Shawn Mendes"
    }

];


/* ==========================================
   게임 변수
========================================== */

let teams = [];

let currentTeamIndex = 0;

let gameBoard = [];

let selectedIndex = -1;

let gameStarted = false;


/* ==========================================
   화면 전환
========================================== */

function showScreen(id) {

    document.querySelectorAll(".screen").forEach(screen => {
        screen.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* ==========================================
   팀 추가
========================================== */

function addTeam() {

    const input = document.getElementById("teamInput");

    const name = input.value.trim();

    if (name === "") {

        alert("팀 이름을 입력해주세요.");

        return;
    }

    teams.push({
        name: name,
        score: 0
    });

    input.value = "";

    renderTeamList();
}


/* ==========================================
   팀 목록 표시
========================================== */

function renderTeamList() {

    const list = document.getElementById("teamList");

    list.innerHTML = "";

    teams.forEach((team, index) => {

        const div = document.createElement("div");

        div.className = "team-item";

        div.textContent =
            `${index + 1}팀 - ${team.name}`;

        list.appendChild(div);

    });

}


/* ==========================================
   게임 시작
========================================== */

function startGame() {

    if (teams.length < 2) {

        alert("최소 2개의 팀을 추가해주세요.");

        return;
    }

    gameStarted = true;

    currentTeamIndex = 0;

    createBoard();

    showScreen("boardScreen");

    renderBoard();

    updateScoreboard();

}


/* ==========================================
   배열 섞기
   Fisher-Yates Shuffle
========================================== */

function shuffle(array) {

    const arr = [...array];

    for (
        let i = arr.length - 1;
        i > 0;
        i--
    ) {

        const j =
            Math.floor(Math.random() * (i + 1));

        [
            arr[i],
            arr[j]
        ] = [
            arr[j],
            arr[i]
        ];

    }

    return arr;

}


/* ==========================================
   게임판 만들기
   35곡 + 꽝 5개
========================================== */

function createBoard() {

    const shuffledSongs =
        shuffle(songs);

    gameBoard = [];

    /*
       노래 객체 자체를 넣기 때문에
       제목과 정답의 순서가 절대 꼬이지 않음
    */

    for (let i = 0; i < 35; i++) {

        gameBoard.push({

            type: "song",

            title: shuffledSongs[i].title,

            artist: shuffledSongs[i].artist,

            used: false

        });

    }


    /*
       꽝 5개 추가
    */

    for (let i = 0; i < 5; i++) {

        gameBoard.push({

            type: "boom",

            title: "",

            artist: "",

            used: false

        });

    }


    /*
       노래 35개 + 꽝 5개 전체를 섞음
    */

    gameBoard =
        shuffle(gameBoard);

}


/* ==========================================
   보드 표시
========================================== */

function renderBoard() {

    const board =
        document.getElementById("board");

    board.innerHTML = "";

    gameBoard.forEach((cell, index) => {

        const button =
            document.createElement("div");

        button.className = "cell";

        if (cell.used) {

            button.classList.add("used");

            button.textContent = "✓";

        } else {

            button.textContent =
                index + 1;

            button.onclick = function() {

                selectCell(index);

            };

        }

        board.appendChild(button);

    });


    updateTurnInfo();

}


/* ==========================================
   현재 팀 표시
========================================== */

function updateTurnInfo() {

    const info =
        document.getElementById("turnInfo");

    if (teams.length === 0) {

        info.textContent = "";

        return;
    }

    info.textContent =
        `현재 차례: ${teams[currentTeamIndex].name}`;

}


/* ==========================================
   점수판
========================================== */

function updateScoreboard() {

    const scoreboard =
        document.getElementById("scoreboard");

    scoreboard.innerHTML = "";

    teams.forEach((team, index) => {

        const card =
            document.createElement("div");

        card.className = "score-card";

        if (index === currentTeamIndex) {

            card.classList.add("current");

        }

        card.innerHTML = `

            <div class="score-name">
                ${escapeHTML(team.name)}
            </div>

            <div class="score-value">
                ${team.score}점
            </div>

        `;

        scoreboard.appendChild(card);

    });

}


/* ==========================================
   번호 선택
========================================== */

function selectCell(index) {

    if (!gameStarted) {

        return;
    }

    if (selectedIndex !== -1) {

        return;
    }

    const cell = gameBoard[index];

    if (cell.used) {

        return;
    }

    selectedIndex = index;

    cell.used = true;

    document.getElementById("questionNumber")
        .textContent =
        `${index + 1}번 문제`;

    document.getElementById("currentTeam")
        .textContent =
        `현재 팀: ${teams[currentTeamIndex].name}`;

    document.getElementById("answerInput").value = "";

    document.getElementById("result").textContent = "";

    document.getElementById("correctAnswerBox").style.display = "none";

    document.getElementById("nextArea").style.display = "none";

    document.getElementById("answerButton").style.display = "inline-block";

    showScreen("questionScreen");

    setTimeout(() => {

        document
            .getElementById("answerInput")
            .focus();

    }, 300);

}


/* ==========================================
   정답 비교용 함수
========================================== */

/*
   여기서 중요한 부분!

   대문자/소문자 무시
   띄어쓰기 무시
   - 무시
   ' 무시
   , . ! ? & 등 모든 기호 무시

   결국 영어 알파벳만 비교함.

   예:
   Shape of You
   shapeofyou
   SHAPE-OF-YOU
   Shape-of-You

   전부

   shapeofyou

   로 바뀌어서 정답 처리됨.
*/

function normalize(text) {

    return text
        .toLowerCase()
        .replace(/[^a-z]/g, "");

}


/* ==========================================
   정답 확인
========================================== */

function checkAnswer() {

    if (selectedIndex === -1) {

        return;
    }

    const cell =
        gameBoard[selectedIndex];

    const input =
        document.getElementById("answerInput");

    const userAnswer =
        input.value.trim();


    if (userAnswer === "") {

        alert("정답을 입력해주세요.");

        return;
    }


    const result =
        document.getElementById("result");

    const answerBox =
        document.getElementById("correctAnswerBox");

    const correctTitle =
        document.getElementById("correctTitle");

    const correctArtist =
        document.getElementById("correctArtist");


    /*
       꽝
    */

    if (cell.type === "boom") {

        teams[currentTeamIndex].score -= 1;

        result.textContent =
            "💥 꽝! -1점";

        result.style.color = "#ffdddd";

        correctTitle.textContent =
            "꽝입니다!";

        correctArtist.textContent =
            "점수 -1점";

        answerBox.style.display = "block";

        showScoreEffect("-1");

        document
            .getElementById("answerButton")
            .style.display = "none";

        document
            .getElementById("nextArea")
            .style.display = "block";

        updateScoreboard();

        return;
    }


    /*
       일반 노래 문제
    */

    const correct =
        normalize(userAnswer) ===
        normalize(cell.title);


    /*
       정답
    */

    if (correct) {

        teams[currentTeamIndex].score += 2;

        result.textContent =
            "🎉 정답! +2점";

        result.style.color = "#d5ffdf";

        showScoreEffect("+2");

    }

    /*
       오답
    */

    else {

        result.textContent =
            "❌ 오답! 0점";

        result.style.color = "#ffd5d5";

        showScoreEffect("0");

    }


    /*
       정답은 정답/오답 상관없이 보여줌
    */

    correctTitle.textContent =
        cell.title;

    correctArtist.textContent =
        cell.artist;

    answerBox.style.display =
        "block";


    /*
       다시 정답 입력하지 못하도록
    */

    document
        .getElementById("answerButton")
        .style.display = "none";


    document
        .getElementById("nextArea")
        .style.display = "block";


    updateScoreboard();

}


/* ==========================================
   점수 효과
========================================== */

function showScoreEffect(text) {

    const effect =
        document.getElementById("scoreEffect");

    effect.textContent = text;

    effect.classList.remove("show");

    void effect.offsetWidth;

    effect.classList.add("show");

}


/* ==========================================
   YouTube 검색
========================================== */

function openYouTube() {

    if (selectedIndex === -1) {

        return;
    }

    const cell =
        gameBoard[selectedIndex];

    if (cell.type === "boom") {

        alert("꽝에는 노래가 없습니다.");

        return;
    }

    const query =
        encodeURIComponent(
            cell.title + " " + cell.artist
        );

    window.open(
        "https://www.youtube.com/results?search_query=" + query,
        "_blank"
    );

}


/* ==========================================
   다음 팀
========================================== */

function goNextTurn() {

    selectedIndex = -1;

    currentTeamIndex++;

    /*
       마지막 팀 다음에는 첫 번째 팀으로
    */

    if (
        currentTeamIndex >= teams.length
    ) {

        currentTeamIndex = 0;

    }


    /*
       모든 칸을 사용했는지 확인
    */

    const allUsed =
        gameBoard.every(
            cell => cell.used
        );


    if (allUsed) {

        endGame();

        return;
    }


    showScreen("boardScreen");

    renderBoard();

    updateScoreboard();

}


/* ==========================================
   게임 종료
========================================== */

function endGame() {

    gameStarted = false;

    const ranking =
        [...teams].sort(
            (a, b) => b.score - a.score
        );

    const finalRanking =
        document.getElementById("finalRanking");

    finalRanking.innerHTML = "";


    ranking.forEach((team, index) => {

        const div =
            document.createElement("div");

        div.className = "final-item";

        let medal = "";

        if (index === 0) {

            medal = "🥇";

        } else if (index === 1) {

            medal = "🥈";

        } else if (index === 2) {

            medal = "🥉";

        } else {

            medal = `${index + 1}위`;

        }

        div.innerHTML = `

            ${medal}

            <strong>
                ${escapeHTML(team.name)}
            </strong>

            -

            <strong>
                ${team.score}점
            </strong>

        `;

        finalRanking.appendChild(div);

    });


    showScreen("endScreen");

}


/* ==========================================
   HTML 문자 안전 처리
========================================== */

function escapeHTML(text) {

    return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}

</script>
